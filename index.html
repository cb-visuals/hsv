<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200&family=Montserrat:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <title>Home | Home Staging Visuals | Toronto Home Staging</title>
    <meta
      name="description"
      content="Toronto and GTA home staging that helps listings sell faster. Home Staging Visuals stages vacant properties, occupied homes, and flip redesigns for sale."
    />
  </head>
  <body>
    <script>
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // Decodes the path the 404.html redirect encoded into the query
      // string, and restores it via history.replaceState before React
      // Router ever sees the URL — see public/404.html for the other half.
      ;(function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&")
            })
            .join("?")
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
