<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home Staging Visuals</title>
    <script>
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // GitHub Pages has no server-side rewrites, so a direct load or refresh
      // on a client-side route (e.g. /about) hits this 404 page instead of
      // index.html. This encodes the intended path into a query string and
      // redirects to the real index.html, which decodes it back (see the
      // matching script in index.html) and hands off to React Router as if
      // nothing happened.
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
